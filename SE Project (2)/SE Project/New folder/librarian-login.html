<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU-SPHERE — Librarian Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <style>
    body { background: linear-gradient(135deg, #1a3a5c 0%, #2e6e9e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-header { background: linear-gradient(135deg, #1a3a5c, #2e6e9e); color: white; border-radius: 16px 16px 0 0; padding: 30px; text-align: center; }
    .login-header img { width: 70px; height: 70px; object-fit: contain; background: white; border-radius: 50%; padding: 8px; margin-bottom: 12px; }
    .login-body { padding: 30px; }
    .role-badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-card card border-0">
    <div class="login-header">
      <img src="assets/img/eduspherelogo (2).png" alt="EDU-SPHERE" onerror="this.style.display='none'">
      <h4 class="mb-0 fw-bold">EDU-SPHERE</h4>
      <div class="role-badge"><i class="bi bi-book-fill me-1"></i>Librarian Portal</div>
    </div>
    <div class="login-body">
      <div id="alertBox" class="alert d-none mb-3"></div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" class="form-control form-control-lg" id="username" placeholder="Enter username" autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter password" autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()"><i class="bi bi-eye" id="eyeIcon"></i></button>
        </div>
      </div>
      <button class="btn btn-primary w-100 btn-lg fw-semibold" id="loginBtn" onclick="doLogin()">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
      <div class="text-center mt-3">
        <a href="index.html" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Role Selection</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    AUTH.redirectIfLoggedIn && AUTH.redirectIfLoggedIn();

    document.getElementById('password').addEventListener('keydown', function(e){
      if (e.key === 'Enter') doLogin();
    });

    function togglePwd() {
      var inp = document.getElementById('password');
      var icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
    }

    function showAlert(msg, type) {
      var el = document.getElementById('alertBox');
      el.className = 'alert alert-' + type;
      el.innerHTML = '<i class="bi bi-' + (type==='danger'?'exclamation-triangle':'check-circle') + '-fill me-2"></i>' + msg;
      el.classList.remove('d-none');
    }

    async function doLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      if (!username || !password) { showAlert('Please enter username and password.', 'warning'); return; }

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      var result = await AUTH.loginAdmin(username, password);
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';

      if (result.success) {
        // Override role to LIBRARIAN in localStorage
        localStorage.setItem('edu_role', 'LIBRARIAN');
        var user = AUTH.getUser();
        if (user) {
          user.role = 'LIBRARIAN';
          localStorage.setItem('edu_user', JSON.stringify(user));
        }
        sessionStorage.setItem('librarianSession', JSON.stringify({ username: username, role: 'LIBRARIAN' }));
        window.location.href = 'librarian-dashboard.html';
      } else {
        showAlert(result.message || 'Invalid username or password.', 'danger');
      }
    }
  </script>
</body>
</html>
