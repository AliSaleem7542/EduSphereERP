<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Import - EDU-SPHERE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0"><i class="bi bi-bug-fill me-2"></i>Import Test & Debug</h4>
      </div>
      <div class="card-body">
        <h5>Current Data in LocalStorage:</h5>
        <div id="currentData" class="mb-4"></div>
        
        <h5>Test Import from JSON:</h5>
        <button class="btn btn-primary" onclick="testImport()">
          <i class="bi bi-play-fill me-2"></i>Test Import
        </button>
        <button class="btn btn-danger ms-2" onclick="clearData()">
          <i class="bi bi-trash-fill me-2"></i>Clear All Data
        </button>
        <div id="testResult" class="mt-3"></div>
      </div>
    </div>
    
    <div class="text-center mt-3">
      <a href="index2.html" class="btn btn-outline-primary">
        <i class="bi bi-house-fill me-2"></i>Back to Dashboard
      </a>
      <a href="data-import.html" class="btn btn-outline-success">
        <i class="bi bi-cloud-upload-fill me-2"></i>Go to Import Page
      </a>
    </div>
  </div>

  <script>
    function showCurrentData() {
      var students = JSON.parse(localStorage.getItem('students') || '[]');
      var sections = JSON.parse(localStorage.getItem('schoolSections') || '[]');
      var classes = JSON.parse(localStorage.getItem('schoolClasses') || '[]');
      var feeRecords = JSON.parse(localStorage.getItem('feeRecords') || '[]');
      
      var html = '<div class="row g-3">' +
        '<div class="col-md-3"><div class="card bg-primary text-white"><div class="card-body text-center"><h3>' + students.length + '</h3><p class="mb-0">Students</p></div></div></div>' +
        '<div class="col-md-3"><div class="card bg-success text-white"><div class="card-body text-center"><h3>' + sections.length + '</h3><p class="mb-0">Sections</p></div></div></div>' +
        '<div class="col-md-3"><div class="card bg-info text-white"><div class="card-body text-center"><h3>' + classes.length + '</h3><p class="mb-0">Classes</p></div></div></div>' +
        '<div class="col-md-3"><div class="card bg-warning text-dark"><div class="card-body text-center"><h3>' + feeRecords.length + '</h3><p class="mb-0">Fee Records</p></div></div></div>' +
        '</div>';
      
      if (students.length > 0) {
        html += '<div class="mt-3"><h6>First 5 Students:</h6><table class="table table-sm table-bordered"><thead class="table-dark"><tr><th>#</th><th>ID</th><th>Name</th><th>Roll No</th><th>Section</th></tr></thead><tbody>';
        students.slice(0, 5).forEach(function(s, i) {
          html += '<tr><td>' + (i+1) + '</td><td>' + s.id + '</td><td>' + s.name + '</td><td>' + s.rollNo + '</td><td>' + s.section + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      
      document.getElementById('currentData').innerHTML = html;
    }
    
    function testImport() {
      var resultDiv = document.getElementById('testResult');
      resultDiv.innerHTML = '<div class="alert alert-info"><i class="bi bi-hourglass-split me-2"></i>Loading data from school_data.json...</div>';
      
      fetch('school_data.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('HTTP error! status: ' + response.status);
          }
          return response.json();
        })
        .then(data => {
          console.log('Data loaded:', data);
          
          var studentCount = data.students ? data.students.length : 0;
          var sectionCount = data.schoolSections ? data.schoolSections.length : 0;
          var classCount = data.schoolClasses ? data.schoolClasses.length : 0;
          var feeCount = data.feeRecords ? data.feeRecords.length : 0;
          
          resultDiv.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle-fill me-2"></i>' +
            '<strong>JSON File Loaded Successfully!</strong><br>' +
            'Students: ' + studentCount + '<br>' +
            'Sections: ' + sectionCount + '<br>' +
            'Classes: ' + classCount + '<br>' +
            'Fee Records: ' + feeCount + '</div>';
          
          if (confirm('Import this data to localStorage?')) {
            if (data.schoolClasses) localStorage.setItem('schoolClasses', JSON.stringify(data.schoolClasses));
            if (data.schoolSections) localStorage.setItem('schoolSections', JSON.stringify(data.schoolSections));
            if (data.students) localStorage.setItem('students', JSON.stringify(data.students));
            if (data.feeRecords) localStorage.setItem('feeRecords', JSON.stringify(data.feeRecords));
            
            resultDiv.innerHTML += '<div class="alert alert-success mt-2"><i class="bi bi-database-fill-check me-2"></i>Data imported to localStorage!</div>';
            showCurrentData();
          }
        })
        .catch(error => {
          console.error('Error:', error);
          resultDiv.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>' +
            '<strong>Error loading data:</strong><br>' + error.message + '<br><br>' +
            '<small>Make sure school_data.json file exists in the same folder.</small></div>';
        });
    }
    
    function clearData() {
      if (!confirm('Clear all data from localStorage?')) return;
      
      ['students', 'schoolSections', 'schoolClasses', 'feeRecords'].forEach(function(key) {
        localStorage.removeItem(key);
      });
      
      document.getElementById('testResult').innerHTML = '<div class="alert alert-warning"><i class="bi bi-trash-fill me-2"></i>All data cleared!</div>';
      showCurrentData();
    }
    
    // Show current data on load
    showCurrentData();
  </script>
</body>
</html>
